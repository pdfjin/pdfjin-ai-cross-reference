[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfjin-ai-cross-reference"
version = "0.1.0"
authors = [
  { name="PDFJin Team", email="support@pdfjin.com" },
]
description = "Multi-document synthesis, cross-referencing, and citation RAG across 50+ PDFs by PDFJin"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["pdf", "pdfjin", "cli", "pdf-tools", "document-processing", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Printing",
    "Topic :: Utilities",
]
dependencies = ["pypdf>=3.0.0", "google-generativeai>=0.4.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
"Homepage" = "https://pdfjin.com"
"Online Tool" = "https://pdfjin.com/pages/ai-cross-reference.html"
"Source" = "https://github.com/pdfjin/pdfjin-ai-cross-reference"
"Bug Tracker" = "https://github.com/pdfjin/pdfjin-ai-cross-reference/issues"

[project.scripts]
pdfjin-ai-cross-reference = "pdfjin_ai_cross_reference.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdfjin_ai_cross_reference*"]
